<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231d9bf0%22/%3E%3Cg%20fill%3D%22white%22%3E%3Crect%20x%3D%225%22%20y%3D%2212%22%20width%3D%2214%22%20height%3D%229%22%20rx%3D%221%22/%3E%3Cpath%20d%3D%22M19%2015h5l3%203v3h-8z%22/%3E%3Ccircle%20cx%3D%2211%22%20cy%3D%2223%22%20r%3D%222.5%22%20fill%3D%22%231d9bf0%22%20stroke%3D%22white%22%20stroke-width%3D%221.5%22/%3E%3Ccircle%20cx%3D%2223%22%20cy%3D%2223%22%20r%3D%222.5%22%20fill%3D%22%231d9bf0%22%20stroke%3D%22white%22%20stroke-width%3D%221.5%22/%3E%3C/g%3E%3C/svg%3E">
    <title>Chapas Disponíveis</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
<div class="container py-3 py-md-5 px-3">
    <h1 class="mb-4 fs-2">Encontre um Chapa</h1>

    <form action="{% url 'chapas:buscar' %}" method="get" class="d-flex flex-column flex-sm-row gap-2 mb-4">
        <input type="text" name="q" class="form-control" placeholder="Buscar por cidade, estado ou nome...">
        <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <h4 class="mb-3">Últimos cadastrados</h4>
    <div class="row g-3">
        {% for chapa in chapas %}
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card bg-secondary-subtle text-body h-100">
                <div class="card-body">
                    <h5 class="card-title d-flex align-items-center flex-wrap gap-1">
                        <i class="bi bi-person-circle"></i>
                        {{ chapa.nome }}
                        {% if chapa.verificado %}
                        <svg class="verified-badge" width="16" height="16" viewBox="0 0 24 24" fill="none" title="Verificado" aria-label="Verificado">
                            <circle cx="12" cy="12" r="12" fill="#1d9bf0"/>
                            <path d="M9.5 12.8l1.8 1.8 4-4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                        {% endif %}
                    </h5>
                    <p class="card-text mb-2">{{ chapa.cidade }} - {{ chapa.estado }}</p>
                    <a href="{% url 'chapas:registrar_contato' chapa.id %}" class="btn btn-success w-100" target="_blank">
                        <i class="bi bi-whatsapp me-1"></i>WhatsApp
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Nenhum chapa cadastrado ainda.</p>
        {% endfor %}
    </div>

    <div class="mt-5 pt-3 border-top border-secondary text-center">
        <!-- Espaço de propaganda: troque o href pelo link do anunciante -->
        <!-- e o src pela imagem do banner (tamanho recomendado: 728x90px) -->
        <a href="https://exemplo-do-anunciante.com" target="_blank" rel="noopener sponsored">
            <img src="https://via.placeholder.com/728x90.png?text=Seu+Banner+Aqui" alt="Propaganda" class="img-fluid rounded">
        </a>
    </div>
</div>
</body>
</html>
